mcp_client_note: >-
  The Tracxn MCP server is remote and OAuth-authenticated, so it needs no installable
  package at all — an MCP client is pointed at the URL. Tracxn's own "Connect any other
  MCP-compatible client" article accordingly recommends the GENERIC upstream SDKs
  (modelcontextprotocol/python-sdk, @modelcontextprotocol/sdk), which belong to the MCP
  project and must not be attributed to Tracxn. See mcp/tracxn-mcp.yml.
third_party_note: >-
  One community package exists and is NOT first-party: github.com/vatsal191201/tracxn-mcp,
  a Python stdio MCP server wrapping the REST API v2.2 with the user's own access token.
  It is unaffiliated with Tracxn, predates the official connector, and is published to no
  registry. Do not mark it official.
