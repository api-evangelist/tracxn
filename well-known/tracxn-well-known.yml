source: >-
  Anonymous probes of /.well-known/* on every Tracxn host reachable from apis.yml
  (tracxn.com, platform.tracxn.com, w.tracxn.com, help.tracxn.com, docs.tracxn.com),
  performed 2026-08-14. The two 200s that carry real documents were discovered from the
  RFC 9728 `WWW-Authenticate: Bearer realm="mcp", resource_metadata=...` challenge
  returned by the live Tracxn MCP server at https://platform.tracxn.com/mcp.
description: >-
  Tracxn serves exactly two genuine /.well-known/ documents, and both are scoped to the
  MCP server rather than to the platform as a whole: the RFC 9728 protected-resource
  metadata and the RFC 8414 authorization-server metadata, each under the /mcp suffix.
  Every unsuffixed /.well-known/ path 404s. This is the standard MCP OAuth discovery
  pair, and it is what makes the Tracxn MCP server callable by a generic MCP client
  without any Tracxn-specific configuration beyond the URL.
hosts:
  - host: https://platform.tracxn.com
    documents:
      - path: /.well-known/oauth-protected-resource/mcp    # RFC 9728
        status: 200
        type: application/json
        file: tracxn-oauth-protected-resource-mcp.json
        real: true
        note: >-
          resource https://platform.tracxn.com/mcp; scopes_supported ["read"];
          authorization_servers ["https://platform.tracxn.com/mcp"].
      - path: /.well-known/oauth-authorization-server/mcp   # RFC 8414
        status: 200
        type: application/json
        file: tracxn-oauth-authorization-server-mcp.json
        real: true
        note: >-
          issuer https://platform.tracxn.com/mcp; authorization_code grant with PKCE
          S256; dynamic client registration at /auth/2.0/mcp/register;
          token_endpoint_auth_methods_supported ["none"] (public clients).
      - path: /.well-known/oauth-protected-resource
        status: 403
        real: false
        note: >-
          Unsuffixed path falls through to the platform API catch-all, which answers
          every unmatched /api-style path with {"errorCode":403000000,"message":"Invalid
          web session access. No user."}. Not a discovery document.
      - path: /.well-known/oauth-authorization-server
