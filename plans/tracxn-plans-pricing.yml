published_prices: false
description: >-
  Tracxn publishes NO price for API or MCP access. There is no self-serve tier, no public
  rate card and no way to buy programmatic access without talking to sales — the pricing page
  and the API developer page both terminate in "contact us". What Tracxn DOES publish, in
  detail, is the SHAPE of the commercial model, and that is recorded below: an annual
  subscription metered on the number of UNIQUE COMPANIES whose data is accessed, with credits
  allocated per cycle and refreshed monthly. plan_count is 0 because no purchasable tier with
  a stated price exists, not because the model is undocumented.
billing_model:
  unit: unique company accessed
  rule: >-
    The first successful access to a company counts as 1 unique company; repeated access to
    the same company does not increase the count. API calls returning empty or null responses
    consume nothing.
  credit_deduction: 1 credit per entity returned (company, funding round, investor, acquisition)
  term: Annual subscription is the standard period
  allocation: Credits allocated at the start of each subscription cycle, refreshed monthly
  reset: Follows the terms of the subscription plan
  exhaustion: HTTP 403, message "API out of credits", application code 900 — contact support to renew
  credit_pools_are_separate: >-
    Platform Export credits and API credits are distinct pools and CANNOT be exchanged for one
    another. MCP credits are a third, separately-capped pool.
