aid: tracxn
name: Tracxn
description: >-
  Tracxn is a market intelligence platform for private company data, tracking
  7.7M+ companies worldwide across 2,000+ sectors, 3K+ feeds and 55K+
  taxonomies for venture capital funds, private equity, investment banks,
  corporate M&A and innovation teams. Alongside the platform it sells Data
  Solutions for programmatic access: the Tracxn API (JSON over HTTPS at
  platform.tracxn.com/api/2.2 with companies, investors, funding transactions
  and acquisition endpoints, plus a rate-limited Playground sandbox), an
  official Tracxn MCP server for AI assistants such as Claude, ChatGPT and
  Cursor, scheduled SFTP dumps, and Snowflake and BigQuery data-share
  integrations. Founded in Bengaluru by Neha Singh and Abhishek Goyal and
  backed by Accel, Tracxn is listed on the Indian stock exchanges (NSE:
  TRACXN).
