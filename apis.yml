- name: Tracxn MCP Server
  description: >-
    Tracxn's official first-party remote Model Context Protocol server, exposing
    the private-market database to any MCP-compatible AI client — Claude,
    ChatGPT, Cursor, Gemini CLI, Perplexity, or anything built on the MCP SDK.
    Eleven documented tools cover companies, legal entities, funding rounds,
    acquisitions, investors, IPO events, time series, locations and sectors,
    plus entity resolution from a company website to Tracxn's internal id and a
    prompt-template loader. It is a hosted URL rather than an installable
    package: a client is pointed at the endpoint and the end user authenticates
    through browser OAuth 2.1 with PKCE and dynamic client registration, under a
    single `read` scope. RFC 8414 and RFC 9728 discovery metadata are served,
    so a generic client needs no Tracxn-specific configuration. Requires an
    active subscription with MCP access; metered at one credit per result.
  humanURL: https://help.tracxn.com/en/articles/14686877-what-is-tracxn-mcp
  baseURL: https://platform.tracxn.com/mcp
