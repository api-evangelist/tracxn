apis:
- name: Tracxn API
  description: >-
    Programmatic access to Tracxn's private-market database. Version 3.0 is
    current and version 2.2 is formally announced for deprecation. A uniform
    JSON-over-HTTPS contract: every data endpoint is a POST taking the same
    four-key body (filter, sort, from, size) with no path or query parameters,
    across companies, funding rounds, acquisitions, IPOs, investors, the
    two-level sector taxonomy (practice areas and feeds), eleven financial and
    employee time-series metrics, and four aggregation endpoints. Authenticates
    with an account-scoped token in the `accessToken` header; tokens are
    environment-specific and issued under Data Solutions > API & Developer
    Tools. `size` defaults to and maxes at 20, so pagination is mandatory, and
    billing is metered per entity returned. A free Playground environment
    scoped to the Cybersecurity feed is available for evaluation. Tracxn
    publishes no OpenAPI; the machine-readable contract is its official public
    Postman workspace.
  humanURL: https://w.tracxn.com/api-developers-page
  baseURL: https://platform.tracxn.com/api/3.0
