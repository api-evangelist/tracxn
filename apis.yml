apis:
- name: Tracxn API
  description: >-
    Programmatic access to Tracxn's private-market database (API version 2.2).
    JSON-over-HTTPS POST endpoints for companies, investors, funding
    transactions and acquisition transactions, filtered by feed/taxonomy
    queries in the request body. Authenticates with an account access token
    sent in the lowercase `accesstoken` header; tokens are issued in the
    platform under Data Solutions > API & Developer Tools. A Playground
    environment (/api/2.2/playground) offers a rate-limited sandbox scoped to
    the Cybersecurity feed for evaluation. Full documentation sits behind the
    platform login; an official public Postman workspace documents the
    collection.
  humanURL: https://w.tracxn.com/api-developers-page
