data_lifecycle:
  freshness_field: >-
    The Companies API returns `lastUpdatedDate`, the date the company profile was last refreshed —
    the one first-class staleness signal in the contract.
  update_cadence: >-
    Most data is published as soon as public sources change; financials, cap tables and employee
    counts follow annual official sources (MCA filings, labour reports).
  data_deletion_obligation: >-
    Deleting Tracxn data at the end of the subscription period is a mandatory compliance
    requirement under the Master Services Agreement.
