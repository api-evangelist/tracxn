description: >-
  Tracxn is mid-migration between two API majors and says so in writing. Version 3.0 is current
  and version 2.2 is formally announced as being phased out — "API Version 2.2 will be deprecated
  soon. Please migrate to Version 3.0 to ensure continued support and access to new features."
  That is a real, published deprecation statement, which is why a Deprecation pointer is emitted.
  What is NOT published is any of the machinery around it: no sunset DATE, no RFC 8594
  Sunset/Deprecation response headers, no dated changelog, no status page and no public SLA. An
  integrator is told to migrate but is given no deadline and no runtime signal, so the deprecation
  is discoverable only by re-reading the guide.
versioning:
  api:
    scheme: uri-path
    current: '3.0'
    current_base: https://platform.tracxn.com/api/3.0
    previous: '2.2'
    previous_base: https://platform.tracxn.com/api/2.2
    example: https://platform.tracxn.com/api/3.0/companies
    note: >-
      Both majors are live and both are documented side by side in the public Postman workspace.
      The v3.0 surface is broader (IPOs, expanded balance-sheet and cash-flow time series,
      dedicated fundingrounds/acquisitions resources, /metric aggregation endpoints); v2.2 still
      uniquely carries investor SEARCH and the bookmarks/custom-list endpoint.
deprecation:
  policy_url: https://www.postman.com/tracxnapi/tracxn-api
  policy_published: true
  statement: >-
    "We're phasing out API Version 2.2 as we transition to Version 3.0. For details and support
    with migration, reach out to apidesk@tracxn.com." (Production guide) /
    "API Version 2.2 will be deprecated soon. Please migrate to Version 3.0 to ensure continued
    support and access to new features." (Playground guide)
  deprecated_version: '2.2'
  replacement_version: '3.0'
  sunset_date: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  migration_contact: apidesk@tracxn.com
  migration_guide_url: null
  gaps:
    - No sunset or end-of-life date is stated — "soon" is the only timeline given.
    - No RFC 8594 Sunset/Deprecation headers are returned, so a running client gets no warning.
    - No published field-level migration map from 2.2 to 3.0 (e.g. transactions -> fundingrounds).
    - >-
      Investor search has no v3.0 equivalent in the public collection (only /investors/metric),
      so a caller cannot fully migrate off 2.2 today.
renames_observed:
  - from: POST /api/2.2/transactions
    to: POST /api/3.0/fundingrounds
  - from: POST /api/2.2/acquisitiontransactions
    to: POST /api/3.0/acquisitions
  - from: POST /api/2.2/companies/timeseries/ebidta
    to: POST /api/3.0/timeseries/ebitda
    note: The v2.2 path carries a misspelling ("ebidta") that is corrected in v3.0.
  - from: POST /api/2.2/companies/timeseries/employeecount
    to: POST /api/3.0/timeseries/employeecountlabourfilings and /employeecountannualreport
    note: One v2.2 endpoint splits into two v3.0 endpoints by source of record.
