source: >-
  "API Update Notice" (production) and "Deprecation Notice" (playground) sections of the Tracxn
  API Guide, published in the official public Postman workspace
  (https://www.postman.com/tracxnapi/tracxn-api), saved at
  postman/tracxn-api-production.postman.json and postman/tracxn-api-playground.postman.json ;
  https://help.tracxn.com/en/articles/8512359-getting-started-with-tracxn-apis ;
